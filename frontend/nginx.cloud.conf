server_tokens off;

# Port 80 is not published by Compose. It only serves the container
# healthcheck and redirects any accidental internal request to HTTPS.
server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    # The demo bootstrap returns the two scoped demo identities. It is behind
    # the independent access gate so the tokens are never public.
    location = /api/demo {
        auth_basic "ProfitOps protected demo";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Login is also gated: API clients must know the access credential before
    # they can exchange a demo password for a JWT.
    location = /api/auth/login {
        auth_basic "ProfitOps protected demo";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Application API calls carry their own Bearer token. They deliberately do
    # not use HTTP Basic here: the SPA sets Authorization: Bearer, and Nginx
    # would otherwise reject that request before the backend could validate it.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        auth_basic "ProfitOps protected demo";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
