name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests use FakeProvider/MockTransport. An empty key guarantees that no
      # automatic CI run can call a real LLM provider.
      LLM_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt

      - name: Verify real LLM is disabled
        env:
          PYTHONPATH: backend
        run: python -c "from app.config import Settings; assert not Settings(_env_file=None).llm_configured, 'CI must not have a real LLM key'"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run MCP stdio smoke
        run: python scripts/mcp_check.py

      - name: Run offline weekly chat replay
        run: python backend/evals/weekly_chat_replay.py

      - name: Run offline LLM replay evaluation
        env:
          LLM_API_KEY: ""
        run: python backend/evals/replay.py

      - name: Verify Alembic baseline
        env:
          PROFITOPS_DATABASE_URL: sqlite:///./alembic-ci.db
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base

  backend-python-311:
    # The project supports Python 3.11+. This job keeps the declared floor
    # honest; it runs the same locked dependencies and checks as the 3.12 job.
    name: Backend pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests use FakeProvider/MockTransport. An empty key guarantees that no
      # automatic CI run can call a real LLM provider.
      LLM_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock.txt

      - name: Verify real LLM is disabled
        env:
          PYTHONPATH: backend
        run: python -c "from app.config import Settings; assert not Settings(_env_file=None).llm_configured, 'CI must not have a real LLM key'"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run offline LLM replay evaluation
        env:
          LLM_API_KEY: ""
        run: python backend/evals/replay.py

      - name: Verify Alembic baseline
        env:
          PROFITOPS_DATABASE_URL: sqlite:///./alembic-ci-311.db
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build production frontend
        run: npm run build

  containers:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t profitops-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t profitops-frontend:ci .
